<div id="cppPanel">
    <div class="cpp-titlebar">
        <i class="fa-solid fa-puzzle-piece"></i>
        <span class="cpp-title">Prompt Patches</span>
        <span class="cpp-title-char"></span>
        <div class="cpp-titlebar-actions">
            <div id="cppMinimize" class="menu_button" title="Minimize"><i class="fa-solid fa-window-minimize"></i></div>
            <div id="cppClose" class="menu_button" title="Close"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="drag-grabber"></div>
    </div>
    <div class="cpp-body">
        <div class="cpp-toolbar">
            <div id="cppAddButton" class="menu_button" title="Add a new patch rule">
                <i class="fa-solid fa-plus"></i>
                <span>Add patch</span>
            </div>
            <span class="cpp-hint">Rules are saved with the bot. "ALL CHATS" rules always run; the others need the slider in each chat.</span>
        </div>
        <div id="cppNotice" class="cpp-notice hidden"></div>
        <div id="cppRuleList" class="cpp-rule-list"></div>
    </div>
</div>
